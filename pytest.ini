[pytest]
# B1 (r1): limit collection to tests/ — scripts/load_test.py is a CLI load-test
# harness (`sys.argv[2]`), NOT a test, and must never be collected.
testpaths = tests
# audit r4 C3: library-level starlette deprecation (suggests httpx2) — our code
# uses the documented public API; the 48 cookie warnings were fixed in code.
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*:UserWarning

# R.5 AC-1: the drift-gate negative test rebuilds a throwaway Postgres DB and
# needs the local superuser path, so it's marked slow.
markers =
    slow: long-running / needs a live local Postgres for the drift gate
