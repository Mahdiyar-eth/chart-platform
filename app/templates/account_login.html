{% extends "base.html" %}
{% block content %}
<div class="st-082e8a15" >
  <div class="glass glow st-eeb1e977" >
    <h1 class="st-27e46985" >ورود با شماره موبایل</h1>
    <p class="muted st-ce310a7b" >کد تأیید ۵ رقمی به موبایلت پیامک می‌شود</p>

    <div class="st-a4ecc208" x-data="login()" x-cloak >
      <template x-if="!sent">
        <form @submit.prevent="send()">
          <label>شماره موبایل</label>
          <input class="input st-6be0d8ba" type="tel" x-model="phone" inputmode="numeric" placeholder="09xxxxxxxxx" dir="ltr" >
          <button class="btn st-6dae102d" type="submit" :disabled="busy" x-text="busy ? 'در حال ارسال…' : 'ارسال کد'"></button>
        </form>
      </template>
      <template x-if="sent">
        <form @submit.prevent="verify()">
          <label>کد تأیید</label>
          <input class="input st-a04b6b13" type="tel" x-model="code" inputmode="numeric" placeholder="00000" dir="ltr" >
          <p class="muted st-5e5f5be4" x-show="devCode">کد تست (dev): <b class="st-dcc6ae22" x-text="devCode" ></b></p>
          <button class="btn st-6dae102d" type="submit" :disabled="busy" x-text="busy ? 'در حال ورود…' : 'ورود'"></button>
          <button type="button" class="muted st-f1d4f2ad" @click="sent=false">تغییر شماره</button>
        </form>
      </template>
      <p class="st-c40e909d" x-show="error" x-text="error" ></p>
    </div>
  </div>
</div>

<script>
function login(){
  return {
    phone: '', code: '', sent: false, busy: false, error: '', devCode: '',
    async send(){
      this.busy = true; this.error = '';
      window.track && window.track('signup_started');
      try{
        const fd = new FormData(); fd.append('phone', this.phone);
        const r = await fetch('/api/auth/otp/request', {method:'POST', body: fd});
        const d = await r.json();
        if(!r.ok) throw new Error(d.detail || 'خطا');
        this.sent = true; this.devCode = d.dev_code || '';
      }catch(e){ this.error = e.message; }
      finally{ this.busy = false; }
    },
    async verify(){
      this.busy = true; this.error = '';
      try{
        const fd = new FormData(); fd.append('phone', this.phone); fd.append('code', this.code);
        const r = await fetch('/api/auth/otp/verify', {method:'POST', body: fd});
        if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || 'کد نادرست'); }
        window.track && window.track('signup_completed');
        window.location.href = '/account';
      }catch(e){ this.error = e.message; }
      finally{ this.busy = false; }
    }
  };
}
</script>
{% endblock %}
