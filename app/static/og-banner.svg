<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="0.55" stop-color="#181b3d"/>
      <stop offset="1" stop-color="#241f33"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="300" y1="120" x2="900" y2="520">
      <stop offset="0" stop-color="#F0C75E"/>
      <stop offset="1" stop-color="#C8901E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.45">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#a8b4e8" opacity="0.5">
    <circle cx="90" cy="120" r="2.2"/><circle cx="240" cy="70" r="1.6"/><circle cx="420" cy="140" r="2.4"/>
    <circle cx="70" cy="420" r="1.8"/><circle cx="1120" cy="100" r="2"/><circle cx="980" cy="180" r="1.5"/>
    <circle cx="1080" cy="500" r="2.2"/><circle cx="330" cy="520" r="1.7"/><circle cx="760" cy="80" r="1.5"/>
    <circle cx="180" cy="270" r="1.4"/><circle cx="1040" cy="330" r="1.6"/>
  </g>
  <!-- zodiac ring centered lower, text stays clear of it -->
  <g transform="translate(600 368)">
    <circle r="188" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
    <circle r="164" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <g stroke="#C8901E" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-146" x2="0" y2="-168"/>
      <line x1="73" y1="-127" x2="84" y2="-146"/><line x1="127" y1="-73" x2="146" y2="-84"/>
      <line x1="146" y1="0" x2="168" y2="0"/><line x1="127" y1="73" x2="146" y2="84"/>
      <line x1="73" y1="127" x2="84" y2="146"/><line x1="0" y1="146" x2="0" y2="168"/>
      <line x1="-73" y1="127" x2="-84" y2="146"/><line x1="-127" y1="73" x2="-146" y2="84"/>
      <line x1="-146" y1="0" x2="-168" y2="0"/><line x1="-127" y1="-73" x2="-146" y2="-84"/>
      <line x1="-73" y1="-127" x2="-84" y2="-146"/>
    </g>
    <!-- small rising-sun emblem at very center -->
    <circle r="40" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M-21 6 A30 30 0 0 1 21 6 Z" fill="#F0C75E" opacity="0.92"/>
    <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="4" x2="0" y2="-8"/><line x1="-10" y1="0" x2="-16" y2="-10"/>
      <line x1="10" y1="0" x2="16" y2="-10"/><line x1="-20" y1="-4" x2="-30" y2="-10"/>
      <line x1="20" y1="-4" x2="30" y2="-10"/>
    </g>
  </g>
  <!-- brand: clean band above the ring -->
  <text x="600" y="138" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif"
        font-size="110" font-weight="800" fill="url(#gold)">زایچه</text>
  <rect x="528" y="172" width="144" height="3" fill="url(#gold)" opacity="0.85"/>
  <text x="600" y="600" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif"
        font-size="34" fill="#FFD9A8">نقشهٔ تولد تو، راهنمای زندگی</text>
  <text x="600" y="617" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif"
        font-size="20" fill="#FFD9A8" letter-spacing="1">zayche • chart.negar.io</text>
</svg>