name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # R4/W5: includes the vector extension so CREATE EXTENSION works in CI
        env:
          POSTGRES_DB: chart_platform_test
          POSTGRES_USER: chart_test
          POSTGRES_PASSWORD: chart_test_pw
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chart_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://chart_test:chart_test_pw@127.0.0.1:5432/chart_platform_test
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      REDIS_URL: redis://127.0.0.1:6379/0
      # R4/W2: required-at-import secrets (gitignored, so set test-safe defaults
      # so a fresh checkout runs without any external key). Never prod values.
      ADMIN_PIN: "000000"
      AUTH_SECRET: "ci-test-auth-secret-000"
      SECRETS_MASTER_KEY: "ci-test-master-key-000"
      ADMIN_SECRET: "ci-test-admin-secret-000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0
      - name: Test
        run: |
          # R4/W5: init_db() self-provisions the pgvector extension (guarded) when
          # CREATE_ALL_ON_BOOT=1, so no separate psql step is needed. The fresh-DB
          # drift gate in ci.sh also installs vector itself.
          scripts/ci.sh
